name: Vendor fixture tests

on:
  push:
    paths:
      - 'application/qmodem/**'
      - 'testcases/**'
      - 'scripts/import_testcases.sh'
      - '.github/workflows/vendor-fixtures.yml'
  pull_request:
    paths:
      - 'application/qmodem/**'
      - 'testcases/**'
      - 'scripts/import_testcases.sh'
      - '.github/workflows/vendor-fixtures.yml'

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y gcc jq libsodium-dev xxd
      - name: Build and test qmodem-seal
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -o /tmp/qmodem-seal application/qmodem/src/qmodem-seal/qmodem-seal.c -lsodium
          application/qmodem/tests/qmodem-seal/test_qmodem_seal.sh /tmp/qmodem-seal
      - name: Check shell syntax
        run: bash scripts/check_all.sh --only shell
      - name: Enforce command boundary
        run: |
          application/qmodem/tests/test_vendor_cmds_boundary.sh
          application/qmodem/tests/test_core_cmds.sh
          application/qmodem/tests/test_sms_forwarder_conflicts.sh
          application/qmodem/tests/test_sms_transport_modes.sh
          node luci/luci-app-qmodem/tests/test_sms_service.js
          application/qmodem/tests/test_fixture_collection_bytes.sh
          application/qmodem/tests/test_recognition_collection.sh
          application/qmodem/tests/test_recognition_fixtures.sh
          application/qmodem/tests/test_fixture_profiles.sh
          QMODEM_TEST_SEAL_BIN=/tmp/qmodem-seal \
            application/qmodem/tests/test_collect_encryption.sh
      - name: Replay vendor fixtures
        run: application/qmodem/tests/test_vendor_fixtures.sh
