name: Publish Existing Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      source_run_id:
        description: Successful build workflow run containing all artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -eu
          mkdir -p releases
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir releases/artifacts
          find releases/artifacts -type f -print

      # 交付策略：Release 资产必须是可直接安装的散装包（.ipk / .apk），
      # 绝不做 tar.gz/zip 二次打包——用户下载后应能直接
      # `opkg install xxx.ipk` / `apk add xxx.apk`。
      - name: Collect installable packages
        run: |
          set -eu
          find releases/artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} releases/ \;
          ls releases/*.ipk releases/*.apk >/dev/null 2>&1 || {
            echo "no installable package found in downloaded artifacts" >&2
            exit 1
          }
          ls -l releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: false
          files: releases/*.ipk releases/*.apk
          generate_release_notes: false
