name: "OpenWrt SDK 自动编译"
permissions:
  contents: write

on:
  # 仅在以下三种情况编译（不再每次推送都跑全量构建）：
  #   1) 推送 v* 标签（发版）：由 tagger.yml 在 version.mk 变更时自动打标签，或人工打标签触发
  #   2) 手动触发：Actions 页面 Run workflow
  #   3) PR 到 main：合并前校验，paths-ignore 跳过纯文档 / CI 改动
  workflow_dispatch:
    inputs:
      note:
        description: 本次手动编译的说明（仅记录，便于在运行列表中区分）
        required: false
        default: manual
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - ".github/**"

env:
  TZ: Asia/Shanghai

# 同一 ref 多次推送时取消仍在排队的旧运行：SDK 缓存已可跨提交复用，
# 保留最新一次即可，避免慢构建互相排队吃掉 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job_prepare:
    name: 准备发布元数据
    runs-on: ubuntu-26.04
    outputs:
      branch_name: ${{ steps.determine_push.outputs.branch_name }}
      tag_name: ${{ steps.determine_push.outputs.tag_name }}
      push_type: ${{ steps.determine_push.outputs.push_type }}
      is_pr: ${{ steps.determine_push.outputs.is_pr }}

    steps:
      - name: 判定推送类型
        id: determine_push
        run: |
            # 本次运行只有两种来源：tag 推送（发布）或手动触发 / PR
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "This is a tag push."
              echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
              echo "push_type=tag" >> $GITHUB_OUTPUT
            else
              echo "This is a branch push."
              echo "branch_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
              echo "push_type=branch" >> $GITHUB_OUTPUT
            fi
            is_pr=$([[ "${{ github.event_name }}" == "pull_request" ]] && echo 1 || echo 0)
            echo "is_pr=${is_pr}" >> $GITHUB_OUTPUT

      - name: 校验发布标签来源
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          git init tag-check
          cd tag-check
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          case "${GITHUB_REF_NAME}" in
            *-rc.*|*-beta.*|*_rc*|*_beta*)
              git merge-base --is-ancestor "$tag_commit" origin/main || {
                echo "pre-release tags must point to main" >&2
                exit 1
              }
              ;;
            v[0-9]*.[0-9]*.[0-9]*)
              # stable 分支已删除（2026-10-14）：稳定版 tag 统一指向 main
              git merge-base --is-ancestor "$tag_commit" origin/main || {
                echo "release tags must point to main" >&2
                exit 1
              }
              ;;
            *)
              echo "unsupported QModem release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: 'qmodem'

      - name: 生成发布说明
        id: update_modem_support_list
        run: |
          cd qmodem
          python3 ./scripts/update_support_list.py temp_support_list ./application/qmodem/files/usr/share/qmodem/modem_support.json
          mv temp_support_list_release_notes.md ./release_note.md
      
      - name: 上传发布说明
        id: upload_release_note
        uses: actions/upload-artifact@v7
        with:
          name: Release Note
          path: ./qmodem/release_note.md

  job_build_qmodem:
    name: 构建 QModem
    needs: [job_prepare]
    if: ${{ always() && needs.job_prepare.result == 'success' }}
    strategy:
      matrix:
        # 当前只产出 arm64（tier 2，rustup 有预编译 std，稳定版工具链即可）。
        # mipsel 目标（mmips_*）已移出矩阵：它是 tier 3，需要 nightly +
        # -Z build-std，std 链接阶段在 OpenWrt SDK 的交叉 gcc 上无法解析
        # musl 启动文件/-lunwind（详见 CHANGELOG 与 build-rust.sh 注释），
        # 待该链接链路打通后再加回。
        build_arch: ['arm64_ipk',"arm64_apk","arm64_apk_immortalwrt"]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: 安装编译依赖
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison coreutils g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: GNU install shim（ubuntu-26.04 uutils coreutils 兼容）
        # Ubuntu 26.04 把 GNU coreutils 换成了 Rust 重写的 uutils coreutils，
        # `install --version` 输出不再含 "GNU"，OpenWrt SDK 的 prereq 检查
        # （include/prereq-build.mk: `install --version | grep GNU`，候选依次
        # 为 install / ginstall）因此失败，所有构建 job 死在「初始化 SDK 环境」。
        # 这里放一个 ginstall wrapper（OpenWrt 探测的第二候选）：--version 输出
        # GNU 字样通过检查，其余参数原样转发给系统 install（uutils 行为兼容
        # OpenWrt 用到的 -d/-m/-D/-p/-t/-T 选项）。系统 install 本身能过检查时
        # 跳过安装。
        run: |
          if install --version 2>/dev/null | grep -q GNU; then
            echo "system install already reports GNU, shim not needed"
            exit 0
          fi
          echo "system install --version output:" >&2
          install --version >&2 || true
          printf '%s\n' \
            '#!/bin/sh' \
            'if [ "$1" = "--version" ]; then echo "install (GNU coreutils) 9.4"; exit 0; fi' \
            'exec /usr/bin/install "$@"' \
            | sudo tee /usr/local/bin/ginstall >/dev/null
          sudo chmod +x /usr/local/bin/ginstall
          ginstall --version

      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: 'qmodem'


      - name: 导入架构环境变量
        run: cat qmodem/.github/workflows/${{ matrix.build_arch }}.env >> "$GITHUB_ENV"

      - name: 解析 snapshot SDK
        id: resolve-sdk
        if: env.SDK_PREFIX != ''
        run: |
          wget -q "${SDK_URL}sha256sums" -O sdk-sha256sums
          line=$(awk -v prefix="*${SDK_PREFIX}" -v suffix=".${SDK_EXT}" '
            index($2, prefix) == 1 && substr($2, length($2) - length(suffix) + 1) == suffix {
              match_line=$0
              count++
            }
            END {
              if (count != 1) {
                print "expected one matching SDK, found " count > "/dev/stderr"
                exit 1
              }
              print match_line
            }
          ' sdk-sha256sums)
          sdk_sha256=${line%% *}
          sdk_file=${line#* \*}
          sdk_name=${sdk_file%.${SDK_EXT}}
          echo "Resolved snapshot SDK: ${sdk_file}"
          echo "SDK_NAME=${sdk_name}" >> "$GITHUB_ENV"
          echo "SDK_SHA256=${sdk_sha256}" >> "$GITHUB_ENV"
          echo "sdk_name=${sdk_name}" >> "$GITHUB_OUTPUT"

      - name: 缓存 OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v6
        with:
          path: sdk
          # 缓存键不含 github.sha：SDK 与其 build_dir 可跨提交复用，
          # 只有 SDK 版本（或缓存格式版本）变化才重建。
          # 版本号 v2：v1 缓存是 ubuntu-24.04 runner 构建的，SDK 的
          # staging_dir/host/bin/python3 符号链接指向 24.04 的 Python 版本，
          # 在 26.04 上报 "not found" 导致 util-linux 编译失败；v2 在 26.04
          # 上重建，链接随 runner 系统 Python 走。
          key: openwrt-sdk-${{ matrix.build_arch }}-${{ env.SDK_NAME }}${{ steps.resolve-sdk.outputs.sdk_name }}-v2

      - name: 初始化 SDK 环境
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          url_sdk: ${{ env.SDK_URL }}${{ env.SDK_NAME}}.${{ env.SDK_EXT }}
        run: |
          file_name="${SDK_NAME}.${SDK_EXT}"
          wget "${url_sdk}"
          if [ -n "${SDK_SHA256:-}" ]; then
            printf '%s  %s\n' "$SDK_SHA256" "$file_name" | sha256sum -c -
          fi
          if [ "${SDK_EXT}" == "tar.zst" ]; then
            mkdir sdk && tar --zstd -xvf $file_name -C ./sdk --strip-components=1
          elif [ "${SDK_EXT}" == "tar.xz" ]; then
            mkdir sdk && tar -xvf $file_name -C ./sdk --strip-components=1
          fi
          cd sdk
          # Feeds must come from the same OpenWrt generation the SDK was built
          # from. The 23.05 release SDK ships CMake 3.26, while current luci
          # master requires CMake 3.31, so feeding master into a release SDK
          # breaks packages such as rpcd-mod-luci. Release SDKs therefore track
          # their own release branch; snapshot SDKs keep the development feeds.
          # Feeds must come from the same distribution the SDK was built from,
          # otherwise the produced packages link against library ABIs the target
          # device does not have. Concretely: OpenWrt master ships
          # libubus20260925 while ImmortalWrt master ships libubus20260628, so an
          # OpenWrt-built apk is uninstallable on an ImmortalWrt device.
          feed_flavor="${SDK_FLAVOR:-openwrt}"
          if [ "$feed_flavor" = "immortalwrt" ]; then
            # ImmortalWrt takes immortalwrt/immortalwrt as the base feed: ubus,
            # libubox and libblobmsg-json ABI versions all come from there.
            # packages/luci use the ImmortalWrt mirrors; routing stays on the
            # OpenWrt repository, matching ImmortalWrt's own feeds.conf.default.
            feed_ref=master
            base_ref=master
            base_repo=https://github.com/immortalwrt/immortalwrt.git
            packages_repo=https://github.com/immortalwrt/packages.git
            luci_repo=https://github.com/immortalwrt/luci.git
            routing_repo=https://github.com/openwrt/routing.git
          else
            base_repo=https://github.com/openwrt/openwrt.git
            packages_repo=https://github.com/openwrt/packages.git
            luci_repo=https://github.com/openwrt/luci.git
            routing_repo=https://git.openwrt.org/feed/routing.git
            if [ -n "${SDK_PREFIX:-}" ]; then
              feed_ref=master
              base_ref=main
            else
              feed_ref="openwrt-$(echo "$SDK_NAME" | sed -n 's/^openwrt-sdk-\([0-9]*\.[0-9]*\)\..*/\1/p')"
              if [ -z "$feed_ref" ] || [ "$feed_ref" = "openwrt-" ]; then
                echo "cannot derive the feed branch from SDK_NAME='$SDK_NAME'" >&2
                exit 1
              fi
              base_ref="$feed_ref"
            fi
          fi
          echo "using feeds(flavor=$feed_flavor): base=$base_ref packages=$feed_ref luci=$feed_ref routing=$feed_ref"
          echo "src-git base $base_repo;$base_ref" > feeds.conf
          echo "src-git packages $packages_repo;$feed_ref" >> feeds.conf
          echo "src-git luci $luci_repo;$feed_ref" >> feeds.conf
          echo "src-git routing $routing_repo;$feed_ref" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..
          echo "src-link qmodem `pwd`/qmodem" >> sdk/feeds.conf
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem
          rm -rf feeds/base/package/kernel/gpio-button-hotplug
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          cat ../qmodem/.github/workflows/openwrt_package.config >> .config
          make defconfig
          make clean
          # make clean may regenerate package selections; enforce the
          # unavailable legacy GPIO module exclusion immediately before build.
          sed -i '/^CONFIG_PACKAGE_gpio-button-hotplug=/d' .config
          echo 'CONFIG_PACKAGE_gpio-button-hotplug=n' >> .config
          sed -i '/^CONFIG_PACKAGE_libopenssl=/d;/^CONFIG_PACKAGE_openssl-util=/d' .config
          echo 'CONFIG_PACKAGE_libopenssl=n' >> .config
          echo 'CONFIG_PACKAGE_openssl-util=n' >> .config

      # Rust 工具链：qmodem-atd 由包的 Build/Compile 现场交叉编译（linker 用
      # SDK 自带工具链，保证与目标 sysroot 的 musl/libubus ABI 一致）。
      # aarch64 / x86_64 musl 是 tier 2，稳定版即可；mipsel musl 是 tier 3
      # （std 可用但 rustup 无预编译），需要 nightly + rust-src + -Z build-std。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - name: 安装 nightly Rust（mipsel build-std 专用）
        if: startsWith(matrix.build_arch, 'mmips_')
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: 缓存 Rust 构建产物
        # 缓存 cargo registry 与 rust/target：第二次构建只重编变动的 crate，
        # 不必再拉依赖、再编一遍全部依赖树。
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: qmodem/rust
          key: ${{ matrix.build_arch }}

      - name: 编译 QModem
        id: compile
        run: |
          set -euo pipefail
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem
          rm -rf feeds/base/package/kernel/gpio-button-hotplug
          # 组件合并后只剩两个源包：qmodem（一体化后端，含全部 C 组件）
          # 与 luci-app-qmodem（统一前端）。原先的 arch-only 列表
          # （tom_modem / ubus_at_daemon）已随合并消失。
          qmodem_package=$(cat ../qmodem/.github/workflows/qmodem_package_generic)
          for package in $qmodem_package; do
            # OpenWrt 默认吞掉 Build/Compile 的全部输出；失败时用 V=s -j1
            # 重跑一次，把真实错误（如 cargo 交叉编译）直接打进日志。
            make package/$package/compile -j$(nproc) \
              || make package/$package/compile V=s -j1
          done
          package_dir="bin/packages/${{ env.SDK_ARCH }}/qmodem"
          required_packages=(
            qmodem luci-app-qmodem luci-i18n-qmodem-zh-cn
          )
          for package in "${required_packages[@]}"; do
            compgen -G "$package_dir/${package}[-_]*" >/dev/null || {
              echo "missing required release package: $package" >&2
              exit 1
            }
          done
          ls "$package_dir"
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=$(pwd)/$package_dir/" >> $GITHUB_ENV

      - name: 上传 QModem 产物
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: QModem-${{ matrix.build_arch }}
          path: ${{ env.FIRMWARE }}*
          retention-days: 7

  job_release_artifacts:
    name: 发布产物
    needs: [job_build_qmodem, job_prepare]
    runs-on: ubuntu-26.04
    # 发布只在 tag 推送时进行（tag 可能来自 tagger.yml 的自动打标签，也可能是人工推送）。
    if: ${{ always() && needs.job_prepare.result == 'success' && needs.job_build_qmodem.result == 'success' && needs.job_prepare.outputs.push_type == 'tag' }}
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: QModem-*
          path: artifacts
        
      - name: 下载发布说明
        uses: actions/download-artifact@v8
        with:
          name: Release Note
          path: release_note

      - name: 创建发布目录
        run: mkdir -p releases

      # 交付策略：Release 资产必须是可直接安装的散装包（.ipk / .apk），
      # 绝不做 tar.gz/zip 二次打包——用户下载后应能直接
      # `opkg install xxx.ipk` / `apk add xxx.apk`。
      - name: 收集可安装包
        run: |
          set -eu
          # ImmortalWrt 变体与 OpenWrt 变体产出的包名完全一致（apk/ipk 文件名
          # 不含发行版信息），直接 cp 会互相覆盖。凡来自 immortalwrt 变体的
          # 资产统一追加 -immortalwrt 后缀，使两类产物可以共存于同一 Release。
          if [ -d artifacts/QModem-arm64_apk_immortalwrt ]; then
            find artifacts/QModem-arm64_apk_immortalwrt -type f -name '*.apk' -print |
              while IFS= read -r f; do
                cp -v "$f" "releases/$(basename "${f%.apk}")-immortalwrt.apk"
              done
          fi
          find artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) \
            -not -path 'artifacts/QModem-arm64_apk_immortalwrt/*' \
            -exec cp -v {} releases/ \;
          # 兜底校验：至少要有 ipk 与 apk 两类，否则视为构建异常
          ls releases/*.ipk releases/*.apk >/dev/null 2>&1 || {
            echo "no installable package found under artifacts/" >&2
            find artifacts -type f -print >&2
            exit 1
          }
          ls -l releases/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        if: ${{ always() && needs.job_prepare.outputs.push_type == 'tag' }}
        with:
          body_path: release_note/release_note.md
          generate_release_notes: true
          tag_name: ${{ needs.job_prepare.outputs.tag_name }}
          prerelease: ${{ contains(needs.job_prepare.outputs.tag_name, '-beta') || contains(needs.job_prepare.outputs.tag_name, '-rc') || contains(needs.job_prepare.outputs.tag_name, '_beta') || contains(needs.job_prepare.outputs.tag_name, '_rc') }}
          files: releases/*
          overwrite_files: true
