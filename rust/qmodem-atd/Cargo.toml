[package]
name = "qmodem-atd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async AT command daemon (Rust rewrite of application/ubus_at_daemon with a tokio actor model)"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true, optional = true }

[features]
default = ["service"]
# Unix-socket JSON line protocol service (pre-ubus test interface).
service = []
# Raw tty transport via libc/termios; needs a real serial device at runtime
# but compiles anywhere.
tty = ["dep:libc"]
# libubus C FFI skeleton; requires libubus headers/libs when linking,
# intended for cross-compile OpenWrt builds.
ubus = []

[lib]
name = "qmodem_atd"
path = "src/lib.rs"

[[bin]]
name = "qmodem-atd"
path = "src/main.rs"
