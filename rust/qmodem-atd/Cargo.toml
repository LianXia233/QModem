[package]
name = "qmodem-atd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AT command daemon on std::thread actors (Rust rewrite of application/ubus_at_daemon, zero external crates)"

[features]
default = ["service"]
# Unix-socket JSON line protocol service (pre-ubus test interface).
service = []
# Raw tty transport via inline termios FFI; needs a real serial device at
# runtime but compiles anywhere (no external crate involved).
tty = []
# libubus C FFI skeleton; requires libubus headers/libs when linking,
# intended for cross-compile OpenWrt builds.
ubus = []

[lib]
name = "qmodem_atd"
path = "src/lib.rs"

[[bin]]
name = "qmodem-atd"
path = "src/main.rs"
